# fly.toml app configuration file generated for prepioneer-client
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "prepioneer-app"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Update API_URL in vite.config.js or use environment variable
# API should point to: https://prepioneer-api.fly.dev
