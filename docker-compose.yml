version: '3.8'

services:
  # PostgreSQL Database (Optional - for production-like testing)
  postgres:
    image: postgres:16-alpine
    container_name: prepioneer_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: prepioneer_user
      POSTGRES_PASSWORD: prepioneer_pw
      POSTGRES_DB: prepioneer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prepioneer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepioneer_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: prepioneer_server
    environment:
      PORT: 5000
      DATABASE_URL: "file:./dev.db"  # SQLite for dev
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_change_this}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "5000:5000"
    networks:
      - prepioneer-network
    volumes:
      - ./server/dev.db:/app/dev.db
    restart: unless-stopped

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: prepioneer_client
    ports:
      - "3000:80"
    networks:
      - prepioneer-network
    depends_on:
      - server
    restart: unless-stopped

networks:
  prepioneer-network:
    driver: bridge

volumes:
  postgres_data:
