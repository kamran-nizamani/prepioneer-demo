# fly.toml app configuration file generated for prepioneer-server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "prepioneer-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Secrets to set via CLI:
# fly secrets set JWT_SECRET="your-secret-here"
# fly secrets set OPENAI_API_KEY="sk-..."
# fly secrets set TWILIO_ACCOUNT_SID="AC..."
# fly secrets set TWILIO_AUTH_TOKEN="..."
# fly secrets set TWILIO_WHATSAPP_NUMBER="whatsapp:+..."
# fly secrets set CLIENT_URL="https://prepioneer-app.fly.dev"
